name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    uses: ChawkiSLIMANI/slimani-factory/.github/workflows/ci-node.yml@v1
    with:
      node-version: "24"

  notify:
    needs: ci
    if: always()
    uses: ChawkiSLIMANI/slimani-factory/.github/workflows/notify-slack.yml@v1
    with:
      kind: events
      text: "CI ${{ needs.ci.result }} — ${{ github.repository }} — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
    secrets:
      SLACK_WEBHOOK_EVENTS: ${{ secrets.SLACK_WEBHOOK_EVENTS }}
      SLACK_WEBHOOK_DECISIONS: ${{ secrets.SLACK_WEBHOOK_DECISIONS }}
