name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      # Les étapes suivantes tournent même si le lint échoue, pour voir tout l'état du projet
      - name: Tests
        if: ${{ !cancelled() }}
        run: npm test --if-present
      - name: Build
        if: ${{ !cancelled() }}
        run: npm run build
