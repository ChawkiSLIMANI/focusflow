name: Revue IA

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    # Les PR en brouillon ne déclenchent pas la revue : elle part au passage en « Ready for review ».
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Tu es un relecteur indépendant. Ne modifie aucun fichier.
            Méthode économe :
            1. Lis le diff une seule fois avec `gh pr diff`.
            2. Lis CLAUDE.md et la spec correspondante dans specs/ si elle existe.
            3. N'ouvre d'autres fichiers que si un constat l'exige.
            4. Poste UN seul commentaire avec `gh pr comment`, au plus tard au 15e tour,
               même si ta revue est incomplète (indique alors ce que tu n'as pas vérifié).
            Vérifie : critères d'acceptation de la spec, changements hors périmètre,
            respect des règles de CLAUDE.md, sécurité, robustesse, maintenabilité.
            Le commentaire contient un verdict (APPROUVÉ, MODIFICATIONS DEMANDÉES ou
            BLOQUANT), puis les constats au format
            « [bloquant|important|mineur] fichier:ligne — problème — correction suggérée ».
            Sois précis et bref.
          claude_args: |
            --max-turns 20
            --model claude-sonnet-4-6
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
