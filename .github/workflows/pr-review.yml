name: Revue IA

on:
  pull_request:
    # Une seule revue par PR : au passage en « Ready for review ».
    # Pour relancer : repasser la PR en brouillon puis en « Ready for review ».
    types: [ready_for_review, reopened]
    # Pas de revue pour les PR qui ne touchent que de la documentation.
    paths-ignore:
      - "**/*.md"
      - "personas/**"
      - "scenarios/**"

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Tu es un relecteur indépendant. Ne modifie aucun fichier.
            Méthode économe :
            1. Liste les fichiers modifiés avec `gh pr diff --name-only`.
            2. Lis le diff SANS les fichiers générés, en une seule commande :
               `git diff origin/main...HEAD -- . ':(exclude)package-lock.json'`
               Ne lis jamais package-lock.json.
            3. Dans la spec correspondante (specs/), lis seulement les critères
               d'acceptation et le hors périmètre. CLAUDE.md est déjà dans ton contexte.
            4. N'ouvre d'autres fichiers que si un constat l'exige.
            5. Poste UN seul commentaire avec `gh pr comment`, même si ta revue est
               incomplète (indique alors ce que tu n'as pas vérifié). Poster le
               commentaire passe avant toute vérification supplémentaire.
            Vérifie : critères d'acceptation, changements hors périmètre, règles de
            CLAUDE.md, sécurité, robustesse, maintenabilité.
            Le commentaire contient un verdict (APPROUVÉ, MODIFICATIONS DEMANDÉES ou
            BLOQUANT), puis les constats au format
            « [bloquant|important|mineur] fichier:ligne — problème — correction suggérée ».
            Sois précis et bref.
          claude_args: |
            --max-turns 15
            --model claude-sonnet-4-6
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git diff:*)"
